name: Sync Marketplace Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync managed marketplace sources and open catalog PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out skillsplace
        uses: actions/checkout@v4
        with:
          path: skillsplace

      - name: Check out skills source repository
        uses: actions/checkout@v4
        with:
          repository: jxpeng98/skills
          path: skills
          token: ${{ secrets.SKILLS_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync skills repository entries
        working-directory: skillsplace
        run: npm run sync:skills -- --source-root ../skills --target-root .

      - name: Sync Qiongli release entries
        working-directory: skillsplace
        run: npm run sync:qiongli
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate marketplace
        working-directory: skillsplace
        run: npm run validate

      - name: Summarize marketplace changes
        id: sync-summary
        working-directory: skillsplace
        run: node scripts/summarize-marketplace-sync.mjs

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          path: skillsplace
          token: ${{ secrets.SKILLS_REPO_TOKEN || github.token }}
          branch: chore/sync-marketplace-sources
          delete-branch: true
          title: ${{ steps.sync-summary.outputs.pr_title }}
          commit-message: ${{ steps.sync-summary.outputs.commit_message }}
          body: ${{ steps.sync-summary.outputs.pr_body }}
          labels: |
            automation
            marketplace

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        working-directory: skillsplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash --auto --delete-branch "${{ steps.create-pr.outputs.pull-request-number }}"
