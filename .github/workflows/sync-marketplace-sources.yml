name: Sync Marketplace Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync managed marketplace sources and open catalog PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out skillsplace
        uses: actions/checkout@v4
        with:
          path: skillsplace

      - name: Check out skills source repository
        uses: actions/checkout@v4
        with:
          repository: jxpeng98/skills
          path: skills
          token: ${{ secrets.SKILLS_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync skills repository entries
        working-directory: skillsplace
        run: npm run sync:skills -- --source-root ../skills --target-root .

      - name: Sync Qiongli release entries
        working-directory: skillsplace
        run: npm run sync:qiongli
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate marketplace
        working-directory: skillsplace
        run: npm run validate

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: skillsplace
          token: ${{ secrets.SKILLS_REPO_TOKEN || github.token }}
          branch: chore/sync-marketplace-sources
          delete-branch: true
          title: "chore: sync marketplace source metadata"
          commit-message: "chore: sync marketplace source metadata"
          body: |
            ## Summary

            - Syncs marketplace entries from `jxpeng98/skills`.
            - Syncs `qiongli` from the latest stable Qiongli release.
            - Syncs `qiongli-next` from the latest Qiongli pre-release.
            - Updates generated Codex, Claude Code, and Antigravity catalog entries.
            - Runs `npm run validate` before opening this PR.

            ## Source

            This PR was generated by `.github/workflows/sync-marketplace-sources.yml`.
          labels: |
            automation
            marketplace
